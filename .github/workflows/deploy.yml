name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Public Distribution
        run: |
          set -e

          rm -rf dist
          mkdir -p dist

          # Copy public website
          cp index.html dist/

          # Copy public assets
          if [ -d "assets" ]; then
            cp -r assets dist/
          fi

          # Copy admin console
          if [ -d "admin" ]; then
            cp -r admin dist/
          fi

          # Copy optional public root files
          for file in CNAME 404.html .nojekyll robots.txt sitemap.xml privacy-policy.html terms.html; do
            if [ -f "$file" ]; then
              cp "$file" dist/
            fi
          done

          # Show exactly what will be published
          echo "===== DIST CONTENTS ====="
          find dist -maxdepth 3 -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
