name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Public Distribution
        run: |
          rm -rf dist
          mkdir -p dist
          
          # Copy mandatory files
          cp index.html dist/
          
          # Copy assets directory if it exists
          if [ -d "assets" ]; then
            cp -r assets dist/
          fi
          
          # Safely copy optional root files only if they exist
          for file in CNAME 404.html .nojekyll robots.txt sitemap.xml; do
            if [ -f "$file" ]; then
              cp "$file" dist/
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
